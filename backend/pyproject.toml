[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsdr-backend"
version = "0.1.0"
description = "Python backend for AgentSDR business workflows and AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "openai>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
